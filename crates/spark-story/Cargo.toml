[package]
name = "spark-story"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experiment runner for continual Spark storytelling with GRPO and CPO"

[[bin]]
name = "spark-story"
path = "src/main.rs"

[dependencies]
burn = { workspace = true, features = ["train", "tui"] }
clap.workspace = true
cubek-fft = "0.3.1"
evaluation = { path = "../evaluation" }
exploration = { path = "../exploration" }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
narrative-world = { path = "../narrative-world" }
rayon = "1"
rlvr = { path = "../rlvr" }
rollout-engine = { path = "../rollout-engine" }
serde_json.workspace = true
spark-burn = { path = "../spark-burn" }

[target.'cfg(target_os = "linux")'.dependencies]
burn = { workspace = true, features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { workspace = true, features = ["metal"] }
