[package]
name = "story-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quillip, a desk for writing and hearing a short story"

[[bin]]
name = "quillip"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["ui", "audio", "system_clipboard"] }
burn.workspace = true
clap.workspace = true
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
kokoro-micro = "1.3"
# kokoro-micro 1.3 calls Session::builder() with no arguments. Later 2.0
# release candidates require an Environment, so stay on the rc it was written for.
ort = { version = "=2.0.0-rc.11", features = ["ndarray"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json.workspace = true
rollout-engine = { path = "../rollout-engine" }
spark-burn = { path = "../spark-burn" }
tokio = { version = "1", features = ["rt", "net", "fs", "time", "io-util", "sync"] }
